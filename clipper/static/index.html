<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipper</title>
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#0c0c10; --panel:#16161d; --line:#2a2a36; --ink:#f2f2f5; --dim:#9696a8;
  --accent:#ffe500; --accent-ink:#111; --bad:#ff5d6c;
}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:880px;padding:40px 16px 64px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--dim);margin:0 0 28px}
.drop{border:2px dashed var(--line);border-radius:16px;background:var(--panel);padding:48px 20px;
  text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:#1b1b24}
.drop strong{display:block;font-size:18px;margin-bottom:6px}
.drop small{color:var(--dim)}
.row{display:flex;gap:12px;align-items:center;margin-top:14px;color:var(--dim);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:20px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:flex;align-items:center;gap:10px;color:var(--dim)}
.steps li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.steps li.active{color:var(--ink)}
.steps li.active::before{background:var(--accent);box-shadow:0 0 0 4px #ffe50033}
.steps li.done::before{background:#4ade80}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.result{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:24px;align-items:start}
video{width:100%;aspect-ratio:9/16;background:#000;border-radius:12px;display:block}
.meta h2{margin:0 0 6px;font-size:22px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:#23232e;color:var(--dim)}
.quote{color:var(--dim);font-size:14px;border-left:3px solid var(--line);padding-left:12px;max-height:180px;overflow:auto}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;border:0;
  border-radius:10px;padding:12px 18px;text-decoration:none;cursor:pointer;font-size:15px;margin-right:8px;margin-top:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.err{color:var(--bad)}
@media (max-width:640px){.result{grid-template-columns:1fr}.result video{max-width:320px;margin:0 auto}}
</style>
</head>
<body>
<main>
  <h1>Clip<span>per</span></h1>
  <p class="sub">Drop in a long video. Get back the best 30 seconds as a vertical, captioned short.</p>

  <section id="upload">
    <label class="drop" id="drop">
      <strong>Drop a video here or click to choose</strong>
      <small>MP4, MOV, MKV, WebM</small>
      <input type="file" id="file" accept="video/*" hidden>
    </label>
    <div class="row"><label><input type="checkbox" id="captions" checked> Burn in captions</label></div>
  </section>

  <section class="card" id="progress" hidden>
    <ul class="steps" id="steps"></ul>
    <div class="bar"><i id="bar"></i></div>
    <p class="err" id="error" hidden></p>
  </section>

  <section class="card" id="done" hidden>
    <div class="result">
      <video id="player" controls playsinline></video>
      <div class="meta">
        <h2 id="title"></h2>
        <div class="tags" id="tags"></div>
        <p id="reason"></p>
        <div class="quote" id="transcript"></div>
        <a class="btn" id="download">Download clip</a>
        <button class="btn ghost" id="again">Clip another</button>
      </div>
    </div>
  </section>
</main>
<script>
const LABELS = {probe:"Reading video", audio:"Extracting audio", transcribe:"Transcribing",
  pick:"Finding the best 30 seconds", reframe:"Tracking the speaker", render:"Rendering vertical clip"};
const $ = id => document.getElementById(id);
const drop = $("drop"), file = $("file");

["dragenter","dragover"].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.add("over")}));
["dragleave","drop"].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.remove("over")}));
drop.addEventListener("drop", ev => ev.dataTransfer.files[0] && start(ev.dataTransfer.files[0]));
file.addEventListener("change", () => file.files[0] && start(file.files[0]));
$("again").addEventListener("click", () => location.reload());

function fmt(t){ const m = Math.floor(t/60), s = Math.floor(t%60); return `${m}:${String(s).padStart(2,"0")}`; }

function renderSteps(stage, uploadPct){
  const keys = Object.keys(LABELS);
  const idx = stage === "upload" ? -1 : keys.indexOf(stage);
  $("steps").innerHTML = [["upload", "Uploading"], ...keys.map(k => [k, LABELS[k]])].map(([k, label], i) => {
    const cls = (i - 1) < idx || stage === "done" ? "done" : (i - 1 === idx ? "active" : "");
    return `<li class="${cls}">${label}</li>`;
  }).join("");
  const overall = stage === "upload" ? uploadPct * 0.15 : 0.15 + 0.85 * Math.max(idx, 0) / keys.length;
  $("bar").style.width = `${Math.round((stage === "done" ? 1 : overall) * 100)}%`;
}

function start(f){
  $("upload").hidden = true; $("progress").hidden = false;
  renderSteps("upload", 0);
  const fd = new FormData();
  fd.append("video", f);
  fd.append("captions", $("captions").checked ? "1" : "0");
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/clip");
  xhr.upload.onprogress = e => e.lengthComputable && renderSteps("upload", e.loaded / e.total);
  xhr.onload = () => {
    let body = {};
    try { body = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status !== 200) return fail(body.error || `Upload failed (${xhr.status})`);
    poll(body.id);
  };
  xhr.onerror = () => fail("Upload failed");
  xhr.send(fd);
}

async function poll(id){
  let job;
  try { job = await (await fetch(`/api/clip/${id}`)).json(); }
  catch { return setTimeout(() => poll(id), 1500); }
  if (job.state === "error") return fail(job.error);
  if (job.state !== "done") { renderSteps(job.stage in LABELS ? job.stage : "probe"); return setTimeout(() => poll(id), 1000); }
  renderSteps("done");
  show(id, job.result);
}

function show(id, r){
  $("progress").hidden = true; $("done").hidden = false;
  $("player").src = `/api/clip/${id}/video`;
  $("download").href = `/api/clip/${id}/video?download=1`;
  $("title").textContent = r.title;
  $("reason").textContent = r.reason;
  $("transcript").textContent = r.transcript ? `“${r.transcript}”` : "";
  const tags = [`${fmt(r.start)} – ${fmt(r.end)}`, `picked by ${r.picked_by}`, r.layout.replace("-", " "),
    r.captions ? "captions" : "no captions"];
  $("tags").innerHTML = tags.map(t => `<span class="tag">${t}</span>`).join("");
}

function fail(msg){ $("error").hidden = false; $("error").textContent = msg; }
</script>
</body>
</html>
