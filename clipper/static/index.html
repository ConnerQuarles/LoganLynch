<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipper</title>
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#0c0c10; --panel:#16161d; --line:#2a2a36; --ink:#f2f2f5; --dim:#9696a8;
  --accent:#ffe500; --accent-ink:#111; --bad:#ff5d6c;
}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:1100px;padding:40px 16px 64px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--dim);margin:0 0 28px}
.drop{border:2px dashed var(--line);border-radius:16px;background:var(--panel);padding:48px 20px;
  text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:#1b1b24}
.drop strong{display:block;font-size:18px;margin-bottom:6px}
.drop small{color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:14px;color:var(--dim);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:20px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:flex;align-items:center;gap:10px;color:var(--dim)}
.steps li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.steps li.active{color:var(--ink)}
.steps li.active::before{background:var(--accent);box-shadow:0 0 0 4px #ffe50033}
.steps li.done::before{background:#4ade80}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.summary{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin:28px 0 4px}
.summary h2{margin:0;font-size:22px}
.summary span{color:var(--dim);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:16px}
.clip{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.clip .vid{position:relative}
video{width:100%;aspect-ratio:9/16;background:#000;display:block}
.rank{position:absolute;top:10px;left:10px;background:#000a;color:var(--ink);font-weight:700;font-size:13px;
  padding:3px 9px;border-radius:99px}
.body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.head{display:flex;gap:14px;align-items:center}
.score{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--tier) calc(var(--s)*1%),var(--line) 0)}
.score b{width:50px;height:50px;border-radius:50%;background:var(--panel);display:grid;place-items:center;
  font-size:20px;color:var(--tier)}
.head h3{margin:0;font-size:16px;line-height:1.3}
.head small{color:var(--dim);font-size:13px}
.subs{display:grid;gap:6px}
.sub-row{display:grid;grid-template-columns:44px 1fr 28px;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
.sub-row .track{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.sub-row .track i{display:block;height:100%;background:var(--tier)}
.sub-row em{font-style:normal;text-align:right;color:var(--ink)}
.reason{margin:0;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:#23232e;color:var(--dim)}
.quote{color:var(--dim);font-size:13px;border-left:3px solid var(--line);padding-left:10px;max-height:96px;overflow:auto}
.body .btn{margin-top:auto;text-align:center}
.note{color:var(--dim);font-size:13px;margin-top:18px}

.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;border:0;
  border-radius:10px;padding:12px 18px;text-decoration:none;cursor:pointer;font-size:15px;margin-right:8px;margin-top:8px}
select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin-left:6px;font:inherit}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.err{color:var(--bad)}
</style>
</head>
<body>
<main>
  <h1>Clip<span>per</span></h1>
  <p class="sub">Drop in a long video. Get back its best 30-second moments as vertical, captioned shorts, each rated out of 100.</p>

  <section id="upload">
    <label class="drop" id="drop">
      <strong>Drop a video here or click to choose</strong>
      <small>MP4, MOV, MKV, WebM</small>
      <input type="file" id="file" accept="video/*" hidden>
    </label>
    <div class="row">
      <label>Clips <select id="count"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></label>
      <label><input type="checkbox" id="captions" checked> Burn in captions</label>
    </div>
  </section>

  <section class="card" id="progress" hidden>
    <ul class="steps" id="steps"></ul>
    <div class="bar"><i id="bar"></i></div>
    <p class="err" id="error" hidden></p>
  </section>

  <section id="done" hidden>
    <div class="summary"><h2 id="summary"></h2><button class="btn ghost" id="again">Clip another</button></div>
    <span class="note" id="method"></span>
    <div class="grid" id="grid"></div>
  </section>
</main>
<script>
const LABELS = {probe:"Reading video", audio:"Extracting audio", transcribe:"Transcribing",
  pick:"Finding & scoring the best moments", render:"Reframing & rendering clips"};
const $ = id => document.getElementById(id);
const drop = $("drop"), file = $("file");

["dragenter","dragover"].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.add("over")}));
["dragleave","drop"].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.remove("over")}));
drop.addEventListener("drop", ev => ev.dataTransfer.files[0] && start(ev.dataTransfer.files[0]));
file.addEventListener("change", () => file.files[0] && start(file.files[0]));
$("again").addEventListener("click", () => location.reload());

function fmt(t){ const m = Math.floor(t/60), s = Math.floor(t%60); return `${m}:${String(s).padStart(2,"0")}`; }

function renderSteps(stage, pct = 0){
  const keys = Object.keys(LABELS);
  const idx = stage === "upload" ? -1 : keys.indexOf(stage);
  $("steps").innerHTML = [["upload", "Uploading"], ...keys.map(k => [k, LABELS[k]])].map(([k, label], i) => {
    const cls = (i - 1) < idx || stage === "done" ? "done" : (i - 1 === idx ? "active" : "");
    return `<li class="${cls}">${label}</li>`;
  }).join("");
  // Rendering dominates the wall-clock time, so it gets the back half of the bar.
  const overall = stage === "upload" ? pct * 0.1
    : stage === "render" ? 0.5 + 0.5 * pct
    : 0.1 + 0.4 * Math.max(idx, 0) / (keys.length - 1);
  $("bar").style.width = `${Math.round((stage === "done" ? 1 : overall) * 100)}%`;
}

function start(f){
  $("upload").hidden = true; $("progress").hidden = false;
  renderSteps("upload", 0);
  const fd = new FormData();
  fd.append("video", f);
  fd.append("captions", $("captions").checked ? "1" : "0");
  fd.append("count", $("count").value);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/clip");
  xhr.upload.onprogress = e => e.lengthComputable && renderSteps("upload", e.loaded / e.total);
  xhr.onload = () => {
    let body = {};
    try { body = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status !== 200) return fail(body.error || `Upload failed (${xhr.status})`);
    poll(body.id);
  };
  xhr.onerror = () => fail("Upload failed");
  xhr.send(fd);
}

async function poll(id){
  let job;
  try { job = await (await fetch(`/api/clip/${id}`)).json(); }
  catch { return setTimeout(() => poll(id), 1500); }
  if (job.state === "error") return fail(job.error);
  if (job.state !== "done") { renderSteps(job.stage in LABELS ? job.stage : "probe", job.stage_pct); return setTimeout(() => poll(id), 1000); }
  renderSteps("done");
  show(id, job.result);
}

const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LAYOUTS = {"fit": "blurred fit", "face-tracked": "face tracked", "vertical-source": "vertical source"};
const tier = s => s >= 80 ? "#4ade80" : s >= 60 ? "#ffe500" : s >= 40 ? "#ff9f43" : "#ff5d6c";

function show(id, r){
  $("progress").hidden = true; $("done").hidden = false;
  const n = r.clips.length;
  $("summary").textContent = `${n} clip${n === 1 ? "" : "s"}, best first`;
  $("method").textContent = r.picked_by === "claude"
    ? "Scored by Claude from the transcript."
    : "Scored by the audio heuristic: scores rank moments within this video, they don't judge content. Set ANTHROPIC_API_KEY for real virality scores.";
  $("grid").innerHTML = r.clips.map((c, i) => {
    const url = `/api/clip/${id}/video/${i + 1}`;
    const sub = (label, v) => `<div class="sub-row">${label}<span class="track"><i style="width:${v}%"></i></span><em>${v}</em></div>`;
    const tags = [`${fmt(c.start)} – ${fmt(c.end)}`, LAYOUTS[c.layout] || c.layout, c.captions ? "captions" : "no captions"];
    return `<article class="clip" style="--tier:${tier(c.score)};--s:${c.score}">
      <div class="vid"><video src="${url}" controls playsinline preload="metadata"></video><span class="rank">#${i + 1}</span></div>
      <div class="body">
        <div class="head"><div class="score"><b>${c.score}</b></div>
          <div><h3>${esc(c.title)}</h3><small>Virality score / 100</small></div></div>
        <div class="subs">${sub("Hook", c.hook)}${sub("Flow", c.flow)}${sub("Value", c.value)}</div>
        <p class="reason">${esc(c.reason)}</p>
        <div class="tags">${tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
        ${c.transcript ? `<div class="quote">“${esc(c.transcript)}”</div>` : ""}
        <a class="btn" href="${url}?download=1">Download</a>
      </div>
    </article>`;
  }).join("");
}

function fail(msg){ $("error").hidden = false; $("error").textContent = msg; }
</script>
</body>
</html>
