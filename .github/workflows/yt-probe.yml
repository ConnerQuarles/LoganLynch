name: yt-probe
on:
  push:
    branches: [claude/opusclip-replica-30sec-ylkjf0]
    paths: [.github/workflows/yt-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: pip install -q "yt-dlp[default]" && yt-dlp --version
      - name: YouTube (long video)
        continue-on-error: true
        run: yt-dlp -f "bv*[height<=720]+ba/b[height<=720]" --merge-output-format mp4 -o yt1.mp4 "https://www.youtube.com/watch?v=aqz-KE-bpKQ" --download-sections "*0-20" && ls -la yt1.mp4
      - name: YouTube (short clip)
        continue-on-error: true
        run: yt-dlp -o yt2.mp4 "https://www.youtube.com/watch?v=jNQXAC9IVRw" && ls -la yt2.mp4
      - name: TikTok
        continue-on-error: true
        run: yt-dlp -o tt.mp4 "https://www.tiktok.com/@scout2015/video/6718335390845095173" && ls -la tt.mp4
